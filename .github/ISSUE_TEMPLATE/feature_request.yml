name: 功能请求
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述你的需求，我们会认真考虑。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认这个功能还未被提出
          required: true
        - label: 我已查看过 [路线图](https://github.com/ninrry/muse/blob/main/docs/ROADMAP.md)，确认该功能不在计划中
          required: false

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 描述你遇到的痛点。例如：当我... 时，我希望能...
      placeholder: 我目前无法... 因此需要...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
      description: 清晰简洁地描述你希望的功能是什么
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 是否有你考虑过但认为不够好的替代方案？
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 对你来说，这个功能有多重要？
      options:
        - 关键（没有它体验很差）
        - 重要（会显著改善使用体验）
        - 一般（锦上添花）
        - 低（无关紧要）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 可以提供设计草图、参考应用截图或其他说明材料
    validations:
      required: false

name: Bug 报告
description: 报告一个应用中的问题或错误
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量填写完整，帮助我们快速定位问题。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认这是一个新问题
          required: true
        - label: 我使用的是 [最新版本](https://github.com/ninrry/muse/releases/latest)
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug 是什么
      placeholder: 当我执行 ... 操作时，发生了 ... 而不是预期的 ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: |
        1. 打开应用
        2. 点击 '...'
        3. 滑动到 '...'
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有错误信息请一并提供
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Muse 版本
      description: 在设置页面可以查看版本号
      placeholder: v1.1.8
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android 版本
      options:
        - Android 9 (API 28)
        - Android 10 (API 29)
        - Android 11 (API 30)
        - Android 12 (API 31)
        - Android 12L (API 32)
        - Android 13 (API 33)
        - Android 14 (API 34)
        - Android 15 (API 35)
        - Android 16 (API 36)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如：小米 14 Pro、Pixel 8
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有 Logcat 日志或截图，请粘贴在此（可拖拽上传图片）
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何可能有助于定位问题的额外信息
    validations:
      required: false

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  performance:
    name: Release Performance Journeys
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run release performance journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest --no-daemon --max-workers=1
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-performance-artifacts
          path: benchmark/build/outputs/connected_android_test_additional_output
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: performance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "keystorePath=../release.keystore"
            echo "keystorePwd=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAliasName=$ANDROID_KEY_ALIAS"
            echo "keyPwd=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Verify and build release
        run: |
          ./gradlew ktlintCheck detekt lint :core:common:test :core:model:test :core:domain:test :core:network:testDebugUnitTest :core:data:testDebugUnitTest :core:media:testDebugUnitTest :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest :feature:library:testDebugUnitTest :feature:audiobook:testDebugUnitTest :feature:player:testDebugUnitTest :feature:settings:testDebugUnitTest :app:testDebugUnitTest :core:database:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestKotlin assembleRelease --no-daemon --max-workers=1
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1"

jobs:
  quality:
    name: Format and Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run formatting and static analysis
        run: ./gradlew ktlintCheck detekt --no-daemon --max-workers=1
      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt
            **/build/reports/ktlint
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run strict Android Lint
        run: ./gradlew lint --no-daemon --max-workers=1
      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*"
          retention-days: 14

  unit-test:
    name: JVM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run JVM tests
        run: ./gradlew :core:common:test :core:model:test :core:domain:test :core:network:testDebugUnitTest :core:data:testDebugUnitTest :core:media:testDebugUnitTest :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest :feature:library:testDebugUnitTest :feature:audiobook:testDebugUnitTest :feature:player:testDebugUnitTest :feature:settings:testDebugUnitTest :app:testDebugUnitTest --no-daemon --max-workers=1
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/build/test-results/test*/**/*.xml"
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests"
          retention-days: 14

  build:
    name: Debug and Release Builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --max-workers=1
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: muse-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

  android-smoke:
    name: API 35 Instrumented Smoke
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run API 35 instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :core:database:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon --max-workers=1
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-35-instrumented-reports
          path: |
            core/database/build/reports/androidTests
            app/build/reports/androidTests
          retention-days: 14

  android-matrix:
    name: API ${{ matrix.api-level }} Full Matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            arch: x86_64
          - api-level: 35
            arch: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run full instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :core:database:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon --max-workers=1

  performance:
    name: Baseline Profile and Macrobenchmark Smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Generate profile and run benchmark journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:generateBaselineProfile --no-daemon --max-workers=1
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --no-daemon --max-workers=1
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-artifacts
          path: |
            app/src/release/generated/baselineProfiles
            baselineprofile/build/reports/androidTests
            benchmark/build/reports/androidTests
            benchmark/build/outputs/connected_android_test_additional_output
          retention-days: 30
